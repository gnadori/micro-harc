<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>micro:harc – Kivetítő</title>
  <style>
    :root {
      --bg: #141225;
      --yellow: #FFD600;
      --left-main: #FF5722;
      --left-dark: #B71C1C;
      --right-main: #00B8D4;
      --right-dark: #006064;
      --ink: #111111;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 87, 34, 0.22), transparent 45%),
        radial-gradient(circle at 80% 20%, rgba(0, 184, 212, 0.22), transparent 45%),
        repeating-linear-gradient(45deg, #18162d 0, #18162d 18px, #131124 18px, #131124 36px);
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Sárga-fekete veszélycsík */
    .hazard-bar {
      height: 18px;
      background: repeating-linear-gradient(
        -45deg,
        #FFD600 0,
        #FFD600 22px,
        #111 22px,
        #111 44px
      );
      border-bottom: 4px solid #111;
      flex-shrink: 0;
    }
    .hazard-bar.bottom {
      border-bottom: none;
      border-top: 4px solid #111;
    }

    /* Fejléc */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 28px 4px;
      flex-shrink: 0;
    }

    .brand-badge {
      background: var(--yellow);
      color: #111;
      font-weight: 900;
      font-size: clamp(1.2rem, 2.4vw, 2rem);
      letter-spacing: 2px;
      padding: 6px 20px;
      border: 4px solid #111;
      border-radius: 14px;
      box-shadow: 5px 5px 0 #111;
      transform: rotate(-1.5deg);
      text-transform: uppercase;
    }

    .round-pill {
      background: #fff;
      color: #111;
      font-weight: 900;
      font-size: clamp(1rem, 1.8vw, 1.45rem);
      padding: 6px 18px;
      border: 4px solid #111;
      border-radius: 999px;
      box-shadow: 4px 4px 0 #111;
      transform: rotate(1deg);
    }

    .fs-btn {
      background: #2c2850;
      color: #fff;
      border: 3px solid #111;
      border-radius: 10px;
      padding: 6px 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 3px 3px 0 #111;
      font-size: 0.9rem;
    }
    .fs-btn:hover { background: #3e3870; }

    /* Fő aréna rács */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 22px;
      padding: 10px 28px 18px;
      align-items: stretch;
      min-height: 0;
    }

    /* Versenyző kártyák */
    .fighter-card {
      position: relative;
      border: 6px solid #111;
      border-radius: 28px;
      box-shadow: 10px 10px 0 #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 20px;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .fighter-card.left {
      background: linear-gradient(160deg, #ff7043 0%, #e64a19 65%, #bf360c 100%);
    }
    .fighter-card.right {
      background: linear-gradient(160deg, #26c6da 0%, #00acc1 65%, #006064 100%);
    }

    /* Képregényes pötty-mintázat háttérben */
    .fighter-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(0,0,0,0.16) 2px, transparent 2px);
      background-size: 16px 16px;
      pointer-events: none;
    }
    .fighter-card > * { position: relative; z-index: 1; }

    .fighter-card.shake {
      animation: cardShake 0.42s ease-in-out;
    }
    .fighter-card.pop {
      animation: cardPop 0.35s ease-out;
    }

    @keyframes cardShake {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      20% { transform: translate(-10px, 4px) rotate(-2deg); }
      40% { transform: translate(10px, -4px) rotate(2deg); }
      60% { transform: translate(-7px, 2px) rotate(-1deg); }
      80% { transform: translate(7px, -2px) rotate(1deg); }
    }
    @keyframes cardPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.035); }
      100% { transform: scale(1); }
    }

    /* Név tábla */
    .name-plate {
      width: 100%;
      background: #fff;
      color: #111;
      border: 5px solid #111;
      border-radius: 18px;
      box-shadow: 6px 6px 0 #111;
      padding: 10px 16px;
      text-align: center;
      font-weight: 900;
      font-size: clamp(1.5rem, 3.2vw, 3rem);
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 1px;
      word-break: break-word;
    }

    /* Robot avatár + Menet csillagok sor */
    .avatar-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .robot-wrap {
      width: clamp(100px, 14vw, 175px);
      height: clamp(95px, 13vw, 165px);
      filter: drop-shadow(5px 6px 0 rgba(0,0,0,0.45));
    }

    .robot-svg {
      width: 100%;
      height: 100%;
      animation: botIdle 1.8s ease-in-out infinite;
    }
    .robot-svg.mood-happy {
      animation: botJump 0.45s ease-in-out infinite;
    }
    .robot-svg.mood-hurt {
      animation: botHurt 0.25s linear infinite;
    }
    .robot-svg.mood-out {
      animation: botFlyOut 0.8s ease-in forwards;
    }

    @keyframes botIdle {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }
    @keyframes botJump {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-16px) scale(1.08); }
    }
    @keyframes botHurt {
      0%, 100% { transform: translateX(-4px) rotate(-6deg); }
      50% { transform: translateX(4px) rotate(6deg); }
    }
    @keyframes botFlyOut {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translateY(40px) scale(0.4) rotate(220deg); opacity: 0.25; }
    }

    /* Nyert menetek (Best of 3 -> 2 korona) */
    .rounds-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.28);
      border: 4px solid #111;
      border-radius: 18px;
      padding: 10px 16px;
    }
    .rounds-label {
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--yellow);
      text-shadow: 2px 2px 0 #111;
    }
    .round-tokens {
      display: flex;
      gap: 12px;
    }
    .token {
      width: clamp(38px, 4.2vw, 56px);
      height: clamp(38px, 4.2vw, 56px);
      border-radius: 50%;
      border: 4px solid #111;
      background: rgba(255,255,255,0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.3rem, 2.4vw, 2rem);
      box-shadow: 3px 3px 0 #111;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    .token.won {
      background: #FFD600;
      transform: scale(1.12) rotate(-8deg);
    }

    /* Óriási pontszám */
    .score-display {
      font-family: "Impact", "Arial Black", "Trebuchet MS", sans-serif;
      font-size: clamp(5.5rem, 15vw, 13rem);
      line-height: 0.92;
      color: #FFF;
      -webkit-text-stroke: 5px #111;
      text-shadow: 8px 8px 0 #111;
      letter-spacing: 2px;
    }

    /* Tételes bontás */
    .stats-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .stat-chip {
      background: rgba(17, 17, 17, 0.78);
      border: 3px solid #111;
      border-radius: 12px;
      padding: 6px 12px;
      font-weight: 800;
      font-size: clamp(0.95rem, 1.5vw, 1.25rem);
      box-shadow: 3px 3px 0 rgba(0,0,0,0.45);
    }

    /* Középső oszlop: Óra + VS + szabály emlékeztető */
    .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      min-width: clamp(220px, 24vw, 340px);
    }

    .timer-box {
      width: 100%;
      background: #111;
      border: 6px solid var(--yellow);
      border-radius: 26px;
      box-shadow: 8px 8px 0 #000;
      padding: 16px 20px;
      text-align: center;
      position: relative;
    }
    .timer-label {
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--yellow);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .timer-value {
      font-family: "Impact", "Arial Black", monospace;
      font-size: clamp(3.6rem, 7.5vw, 6.4rem);
      line-height: 1;
      color: #76FF03;
      text-shadow: 0 0 18px rgba(118, 255, 3, 0.45);
      letter-spacing: 3px;
    }
    .timer-box.paused .timer-value { color: #FFD600; text-shadow: none; }
    .timer-box.danger {
      border-color: #FF1744;
      animation: dangerPulse 0.6s ease-in-out infinite;
    }
    .timer-box.danger .timer-value {
      color: #FF1744;
      text-shadow: 0 0 24px rgba(255, 23, 68, 0.75);
    }
    @keyframes dangerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .vs-badge {
      background: var(--yellow);
      color: #111;
      font-family: "Impact", "Arial Black", sans-serif;
      font-size: clamp(2.4rem, 4.8vw, 4.2rem);
      padding: 8px 26px;
      border: 6px solid #111;
      border-radius: 20px;
      box-shadow: 7px 7px 0 #111;
      transform: rotate(-7deg);
      letter-spacing: 3px;
    }

    .legend-card {
      width: 100%;
      background: #fff;
      color: #111;
      border: 5px solid #111;
      border-radius: 20px;
      box-shadow: 6px 6px 0 #111;
      padding: 12px 16px;
      font-weight: 800;
      font-size: clamp(0.9rem, 1.35vw, 1.15rem);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .legend-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pts-pill {
      background: #111;
      color: var(--yellow);
      border-radius: 8px;
      padding: 2px 9px;
      font-weight: 900;
    }

    /* Képregényes felugró szóbuborék */
    .comic-banner {
      position: fixed;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: var(--yellow);
      color: #111;
      border: 7px solid #111;
      border-radius: 28px;
      box-shadow: 12px 12px 0 #111;
      padding: 20px 44px;
      text-align: center;
      z-index: 40;
      pointer-events: none;
      opacity: 0;
      transition: transform 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.2s;
    }
    .comic-banner.show {
      transform: translate(-50%, -50%) scale(1) rotate(-3deg);
      opacity: 1;
    }
    .comic-banner.left-accent { background: #FFAB91; }
    .comic-banner.right-accent { background: #80DEEA; }
    .comic-banner-title {
      font-family: "Impact", "Arial Black", sans-serif;
      font-size: clamp(2.4rem, 5.5vw, 5rem);
      line-height: 1.05;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .comic-banner-sub {
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      font-weight: 900;
      margin-top: 6px;
    }

    /* Teljes képernyős overlay-ek (3-2-1 HARC / KO rászámolás / Győztes) */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(14, 12, 28, 0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 60;
      text-align: center;
      padding: 24px;
    }
    .overlay.show { display: flex; }

    .big-countdown {
      font-family: "Impact", "Arial Black", sans-serif;
      font-size: clamp(8rem, 24vw, 20rem);
      color: var(--yellow);
      -webkit-text-stroke: 8px #111;
      text-shadow: 14px 14px 0 #111;
      animation: zoomBang 0.55s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    @keyframes zoomBang {
      0% { transform: scale(0.2) rotate(-14deg); opacity: 0; }
      70% { transform: scale(1.12) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .ko-box {
      background: #FF1744;
      border: 8px solid #111;
      border-radius: 32px;
      box-shadow: 14px 14px 0 #111;
      padding: 28px 56px;
    }
    .ko-title {
      font-size: clamp(1.6rem, 3.2vw, 2.8rem);
      font-weight: 900;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 4px 4px 0 #111;
    }
    .ko-num {
      font-family: "Impact", "Arial Black", sans-serif;
      font-size: clamp(7rem, 18vw, 15rem);
      line-height: 1;
      color: var(--yellow);
      -webkit-text-stroke: 6px #111;
      text-shadow: 10px 10px 0 #111;
    }

    .winner-card {
      background: linear-gradient(135deg, #FFD600 0%, #FFAB00 100%);
      color: #111;
      border: 8px solid #111;
      border-radius: 36px;
      box-shadow: 16px 16px 0 #111;
      padding: 36px 60px;
      max-width: 90vw;
      animation: zoomBang 0.5s ease-out;
    }
    .winner-crown { font-size: clamp(4rem, 8vw, 6.5rem); line-height: 1; }
    .winner-label {
      font-size: clamp(1.4rem, 2.5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 8px;
    }
    .winner-name {
      font-family: "Impact", "Arial Black", sans-serif;
      font-size: clamp(3rem, 7vw, 6.2rem);
      line-height: 1.05;
      margin: 12px 0;
      text-transform: uppercase;
      color: #fff;
      -webkit-text-stroke: 4px #111;
      text-shadow: 7px 7px 0 #111;
    }
    .winner-reason {
      font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      font-weight: 900;
      background: #111;
      color: var(--yellow);
      display: inline-block;
      padding: 8px 22px;
      border-radius: 999px;
      margin-top: 6px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 55;
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>
  <div class="hazard-bar"></div>

  <header>
    <div class="brand-badge" id="matchTitle">🤖 MICRO:HARC ARÉNA</div>
    <div class="round-pill" id="roundBadge">3 PERC • KILÖKÉS = +10 PONT</div>
    <button class="fs-btn" id="fsBtn" title="Teljes képernyő (F11)">⛶ Teljes képernyő</button>
  </header>

  <main>
    <!-- BAL VERSENYZŐ -->
    <section class="fighter-card left" id="cardLeft">
      <div class="name-plate" id="leftName">9V-os Rémség</div>

      <div class="avatar-row">
        <div class="robot-wrap" id="leftAvatar"></div>
      </div>

      <div class="score-display" id="leftScore">0</div>

      <div class="stats-row">
        <div class="stat-chip">💥 <span id="leftHit">0</span></div>
        <div class="stat-chip">🔧 <span id="leftDmg">0</span></div>
        <div class="stat-chip">🚀 <span id="leftLift">0</span></div>
        <div class="stat-chip">🕳️ <span id="leftRing">0</span></div>
      </div>
    </section>

    <!-- KÖZÉPSŐ OSZLOP -->
    <section class="center-col">
      <div class="timer-box" id="timerBox">
        <div class="timer-label" id="timerStatus">HARCIDŐ</div>
        <div class="timer-value" id="timerValue">3:00</div>
      </div>

      <div class="vs-badge">VS</div>

      <div class="legend-card">
        <div class="legend-row"><span>💥 Aktív ütközés</span><span class="pts-pill">+1</span></div>
        <div class="legend-row"><span>🔧 Sérülés okozása</span><span class="pts-pill">+2</span></div>
        <div class="legend-row"><span>🚀 Emelés</span><span class="pts-pill">+3</span></div>
        <div class="legend-row"><span>🕳️ Kilökés</span><span class="pts-pill">+10</span></div>
      </div>
    </section>

    <!-- JOBB VERSENYZŐ -->
    <section class="fighter-card right" id="cardRight">
      <div class="name-plate" id="rightName">Bádog Pista</div>

      <div class="avatar-row">
        <div class="robot-wrap" id="rightAvatar"></div>
      </div>

      <div class="score-display" id="rightScore">0</div>

      <div class="stats-row">
        <div class="stat-chip">💥 <span id="rightHit">0</span></div>
        <div class="stat-chip">🔧 <span id="rightDmg">0</span></div>
        <div class="stat-chip">🚀 <span id="rightLift">0</span></div>
        <div class="stat-chip">🕳️ <span id="rightRing">0</span></div>
      </div>
    </section>
  </main>

  <div class="hazard-bar bottom"></div>

  <!-- Képregényes felugró buborék -->
  <div class="comic-banner" id="comicBanner">
    <div class="comic-banner-title" id="bannerTitle">BAM!!</div>
    <div class="comic-banner-sub" id="bannerSub"></div>
  </div>

  <!-- 3-2-1-HARC overlay -->
  <div class="overlay" id="startOverlay">
    <div class="big-countdown" id="startText">3</div>
  </div>

  <!-- KO rászámolás overlay -->
  <div class="overlay" id="koOverlay">
    <div class="ko-box">
      <div class="ko-title" id="koTitle">MOZGÁSKÉPTELENSÉG RÁSZÁMOLÁS!</div>
      <div class="ko-num" id="koNum">10</div>
    </div>
  </div>

  <!-- Győztes overlay -->
  <div class="overlay" id="winnerOverlay">
    <div class="winner-card">
      <div class="winner-crown" id="winnerEmoji">🏆</div>
      <div class="winner-label" id="winnerLabel">A MÉRKŐZÉS GYŐZTESE</div>
      <div class="winner-name" id="winnerName">ROBOT</div>
      <div class="winner-reason" id="winnerReason">2–0 MENETBEN</div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    let state = createDefaultState();
    let lastBannerId = null;
    let lastStartId = null;
    let bannerTimer = null;
    let lastWinnerKey = null;
    let lastSecondBeep = null;

    // Teljes képernyő gomb
    document.getElementById("fsBtn").addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Konfetti motor
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    let confettiPieces = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function launchConfetti(count = 130) {
      const colors = ["#FFD600", "#FF5722", "#00E5FF", "#76FF03", "#FF4081", "#FFFFFF"];
      for (let i = 0; i < count; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * 200,
          w: 8 + Math.random() * 10,
          h: 6 + Math.random() * 10,
          vx: (Math.random() - 0.5) * 6,
          vy: 3 + Math.random() * 6,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.25,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    function confettiLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiPieces = confettiPieces.filter(p => p.y < canvas.height + 40);
      for (const p of confettiPieces) {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      requestAnimationFrame(confettiLoop);
    }
    confettiLoop();

    function triggerCardAnim(side, cls) {
      const el = document.getElementById(side === "left" ? "cardLeft" : "cardRight");
      el.classList.remove("shake", "pop");
      void el.offsetWidth;
      el.classList.add(cls);
    }

    function showBanner(b) {
      const el = document.getElementById("comicBanner");
      document.getElementById("bannerTitle").textContent = b.text;
      document.getElementById("bannerSub").textContent = b.subtext || "";
      el.classList.remove("left-accent", "right-accent", "show");
      if (b.side === "left") el.classList.add("left-accent");
      if (b.side === "right") el.classList.add("right-accent");
      void el.offsetWidth;
      el.classList.add("show");
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => el.classList.remove("show"), 1600);
    }

    function applyState(newState, isSync = true) {
      if (!newState) return;
      const prevLeftPts = state.left.points;
      const prevRightPts = state.right.points;
      state = newState;

      document.getElementById("matchTitle").textContent = "🤖 " + (state.matchTitle || "MICRO:HARC ARÉNA");
      document.getElementById("roundBadge").textContent = "3 PERC • KILÖKÉS = +10 PONT";

      // Bal oldal
      document.getElementById("leftName").textContent = state.left.name || "Bal robot";
      document.getElementById("leftScore").textContent = state.left.points;
      document.getElementById("leftHit").textContent = state.left.stats.hit;
      document.getElementById("leftDmg").textContent = state.left.stats.damage;
      document.getElementById("leftLift").textContent = state.left.stats.lift;
      document.getElementById("leftRing").textContent = state.left.stats.ringout || 0;

      // Jobb oldal
      document.getElementById("rightName").textContent = state.right.name || "Jobb robot";
      document.getElementById("rightScore").textContent = state.right.points;
      document.getElementById("rightHit").textContent = state.right.stats.hit;
      document.getElementById("rightDmg").textContent = state.right.stats.damage;
      document.getElementById("rightLift").textContent = state.right.stats.lift;
      document.getElementById("rightRing").textContent = state.right.stats.ringout || 0;

      if (isSync) {
        if (state.left.points > prevLeftPts) {
          triggerCardAnim("left", "pop");
          triggerCardAnim("right", "shake");
        }
        if (state.right.points > prevRightPts) {
          triggerCardAnim("right", "pop");
          triggerCardAnim("left", "shake");
        }
      }

      // Robot avatárok hangulata
      const now = Date.now();
      const leftMood = state.left.moodUntil > now ? state.left.mood : "idle";
      const rightMood = state.right.moodUntil > now ? state.right.mood : "idle";
      document.getElementById("leftAvatar").innerHTML = renderRobotSVG(state.left.avatar, "left", leftMood);
      document.getElementById("rightAvatar").innerHTML = renderRobotSVG(state.right.avatar, "right", rightMood);

      // Felugró banner
      if (state.lastBanner && state.lastBanner.id !== lastBannerId) {
        lastBannerId = state.lastBanner.id;
        showBanner(state.lastBanner);
      }

      // 3-2-1-HARC overlay
      const startOv = document.getElementById("startOverlay");
      if (state.startCountdown) {
        startOv.classList.add("show");
        if (state.startCountdown.id !== lastStartId) {
          lastStartId = state.startCountdown.id;
          const st = document.getElementById("startText");
          st.textContent = state.startCountdown.step;
          st.style.animation = "none";
          void st.offsetWidth;
          st.style.animation = "";
        }
      } else {
        startOv.classList.remove("show");
      }

      // KO rászámolás overlay
      const koOv = document.getElementById("koOverlay");
      if (state.koCount && state.koCount.active) {
        const targetName = state.koCount.side === "left" ? state.left.name : state.right.name;
        document.getElementById("koTitle").textContent = `RÁSZÁMOLÁS: ${targetName}`;
        document.getElementById("koNum").textContent = state.koCount.sec;
        koOv.classList.add("show");
      } else {
        koOv.classList.remove("show");
      }

      // Győztes overlay
      const winOv = document.getElementById("winnerOverlay");
      if (state.winner) {
        const key = `${state.winner.side}|${state.winner.reason}`;
        if (key !== lastWinnerKey) {
          lastWinnerKey = key;
          if (state.winner.side !== "draw") {
            launchConfetti(160);
          }
        }
        const isDraw = state.winner.side === "draw";
        document.getElementById("winnerEmoji").textContent = isDraw ? "⚖️" : "🏆";
        document.getElementById("winnerLabel").textContent = isDraw ? "DÖNTETLEN!" : "A MÉRKŐZÉS GYŐZTESE";
        document.getElementById("winnerName").textContent = isDraw
          ? "BÍRÓI DÖNTÉS!"
          : (state.winner.side === "left" ? state.left.name : state.right.name);
        document.getElementById("winnerReason").textContent = state.winner.reason;
        winOv.classList.add("show");
      } else {
        lastWinnerKey = null;
        winOv.classList.remove("show");
      }

      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const ms = getEffectiveTimeLeftMs(state);
      const tv = document.getElementById("timerValue");
      const tb = document.getElementById("timerBox");
      const ts = document.getElementById("timerStatus");

      tv.textContent = formatTime(ms);
      tb.classList.toggle("paused", !state.timerRunning && ms > 0);
      const secLeft = Math.ceil(ms / 1000);
      const isDanger = state.timerRunning && secLeft <= 10 && secLeft > 0;
      tb.classList.toggle("danger", isDanger);
      ts.textContent = state.timerRunning ? "HARCIDŐ" : (ms === 0 ? "IDŐ LEJÁRT!" : "SZÜNET / KÉSZENLÉT");

      // Hangulat lejáratkor vissza idle-be
      const now = Date.now();
      if (state.left.mood !== "idle" && state.left.moodUntil > 0 && now >= state.left.moodUntil) {
        state.left.mood = "idle";
        state.left.moodUntil = 0;
        document.getElementById("leftAvatar").innerHTML = renderRobotSVG(state.left.avatar, "left", "idle");
      }
      if (state.right.mood !== "idle" && state.right.moodUntil > 0 && now >= state.right.moodUntil) {
        state.right.mood = "idle";
        state.right.moodUntil = 0;
        document.getElementById("rightAvatar").innerHTML = renderRobotSVG(state.right.avatar, "right", "idle");
      }
    }

    setInterval(updateTimerDisplay, 120);

    // 1. Szinkronizáció postMessage-dzsel (file:// ablakok között is 100% működik!)
    window.addEventListener("message", (ev) => {
      if (ev.data && ev.data.type === "MICROHARC_STATE") {
        applyState(ev.data.state, true);
      }
    });

    // 2. Szinkronizáció BroadcastChannel-lel (http/https/GitHub Pages esetén)
    if ("BroadcastChannel" in window) {
      const bc = new BroadcastChannel(CHANNEL_NAME);
      bc.onmessage = (ev) => {
        if (ev.data && ev.data.type === "MICROHARC_STATE") {
          applyState(ev.data.state, true);
        }
      };
      bc.postMessage({ type: "MICROHARC_HELLO" });
    }

    // 3. Szinkronizáció localStorage-dzsal
    window.addEventListener("storage", (ev) => {
      if (ev.key === STORAGE_KEY && ev.newValue) {
        try { applyState(JSON.parse(ev.newValue), true); } catch (e) {}
      }
    });

    // Kezdő állapot betöltése
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) applyState(JSON.parse(saved), false);
      else applyState(state, false);
    } catch (e) {
      applyState(state, false);
    }

    // Jelezzük a megnyitó (bírói) ablaknak, hogy készen állunk
    if (window.opener && !window.opener.closed) {
      try { window.opener.postMessage({ type: "MICROHARC_HELLO" }, "*"); } catch (e) {}
    }
  </script>
</body>
</html>
